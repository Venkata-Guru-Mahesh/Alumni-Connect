version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: X-Frame-Options
              value: DENY
            - key: X-Content-Type-Options
              value: nosniff
            - key: X-XSS-Protection
              value: '1; mode=block'
            - key: Referrer-Policy
              value: strict-origin-when-cross-origin
        - pattern: '/assets/**'
          headers:
            - key: Cache-Control
              value: public, max-age=31536000, immutable
      rewrites:
        - source: '</^((?!\.(?:css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|webp)$).)*$>'
          target: '/index.html'
          status: 200

